<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeyPeek</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='16' rx='5' fill='%230071E3'/%3E%3Cpath d='M16 12.5v6M16 12.5l-3 3M16 12.5l3 3' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#F2F2F4;--surface:#FFFFFF;--card:#FFFFFF;
  --ink:#1D1D1F;--ink-2:#48484A;--muted:#86868B;
  --line:#E4E4E7;--line-2:#D2D2D7;
  --accent:#0071E3;--accent-ink:#0058B0;--accent-soft:#E7F1FD;
  --key-bg:#FFFFFF;--key-line:#D9D9DE;--key-ink:#3A3A3C;
  --shadow-1:0 1px 2px rgba(0,0,0,.05);
  --shadow-2:0 12px 28px -18px rgba(0,0,0,.28);
  --radius:13px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);cursor:default;
  font-family:"Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
  font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
/* 说明性文字（标题、页脚、面包屑）用箭头，不要 I 形光标 */
.brand,.foot,.crumb,.sec-head,.plat-tag,.empty,.toast,.hero,dl,.dnote{cursor:default}
input,textarea{cursor:text}
/* 磨砂已移除：宿主不再抓背景，页面统一用实色 */
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
::selection{background:var(--accent-soft);color:var(--ink)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
/* 横竖滚动条交汇的那个小方块，默认是页面底色白，会像一块补丁 */
::-webkit-scrollbar-corner{background:transparent}

.app{height:100%;display:flex;flex-direction:column}

/* 顶栏 */
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto}
.mark{width:24px;height:24px;flex:0 0 auto;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center}
.mark svg{width:14px;height:14px;display:block}
.brand b{font-size:13.5px;font-weight:650;letter-spacing:.01em;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.icon-btn{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted);transition:background .14s,color .14s}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.icon-btn.on{color:var(--accent)}
.grip{display:none}
.icon-btn svg{width:15px;height:15px}

/* 搜索：两个条件并列，任一个空即不按它过滤 */
.search{display:flex;gap:8px;padding:2px 16px 10px;flex:0 0 auto}
.fld{position:relative;flex:1 1 auto;min-width:0;display:flex;align-items:center;height:38px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 30px 0 10px;transition:border-color .15s,box-shadow .15s}
.fld:focus-within{border-color:color-mix(in oklab,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px var(--accent-soft)}
.fld .ic{width:14px;height:14px;color:var(--muted);flex:0 0 auto;margin-right:7px}
.fld input{flex:1 1 auto;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:13.5px}
.fld input::placeholder{color:var(--muted);opacity:.9}
.fld.narrow{flex:0 0 152px;padding:0 26px 0 12px}
.fld .sel{flex:1 1 auto;min-width:0;height:100%;display:flex;align-items:center;padding:0 2px;
  text-align:left;font-size:13.5px;color:var(--ink)}
.fld .sel span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fld.open{border-color:color-mix(in oklab,var(--accent) 55%,var(--line));box-shadow:0 0 0 3px var(--accent-soft)}
/* 自绘下拉菜单：原生 select 的展开列表是系统画的，样式改不动，所以自己画 */
.menu{position:fixed;z-index:55;background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 18px 38px -20px rgba(0,0,0,.45);padding:5px;max-height:62vh;overflow:auto;
  transform-origin:top center;animation:menuIn .12s ease-out}
@keyframes menuIn{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
.menu .opt{display:flex;align-items:center;gap:8px;height:31px;padding:0 9px;border-radius:7px;
  font-size:12.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.menu .opt:hover{background:color-mix(in oklab,var(--accent) 6%,var(--card))}
.menu .opt.on{color:var(--accent);background:var(--accent-soft);font-weight:600}
.menu .opt .dotm{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--brand,#D2D2D7)}
.menu .opt .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.menu .opt .tick{flex:0 0 auto;width:12px;color:var(--accent);opacity:0}
.menu .opt.on .tick{opacity:1}
.menu .sepline{height:1px;margin:4px 7px;background:var(--line)}
.fld .caret{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:13px;height:13px;color:var(--muted);pointer-events:none}
.clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;
  display:none;place-items:center;color:var(--muted);font-size:12px;background:var(--paper)}
.clr.show{display:grid}
.clr:hover{color:var(--ink)}

.crumb{display:none;align-items:center;gap:6px;padding:0 16px 8px;flex:0 0 auto}
.crumb.show{display:flex}
.crumb button{font-size:11.5px;color:var(--accent);display:inline-flex;align-items:center;gap:4px;padding:2px 4px;border-radius:5px}
.crumb button:hover{background:var(--accent-soft)}
.crumb .who{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{flex:1 1 auto;overflow:auto;padding:0 16px 34px}

.sec{margin-bottom:14px}
.sec-head{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px}
.sec-head h2{font-size:11.5px;font-weight:650;letter-spacing:.08em;color:var(--ink-2);margin:0;text-transform:uppercase}
.sec-head .hint{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-head .fill{flex:1 1 auto;height:1px;background:var(--line)}
.sec-head .tgl{flex:0 0 auto;width:22px;height:22px;margin:-3px -4px -3px 2px;border-radius:6px;display:grid;place-items:center;
  color:var(--muted);transition:color .12s,background .12s}
.sec-head .tgl:hover{color:var(--ink);background:var(--card)}
.sec-head .tgl svg{width:14px;height:14px;transition:transform .16s}
.sec-head .tgl.col svg{transform:rotate(-90deg)}

/* 平台入口卡片 */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.plat{position:relative;display:flex;align-items:center;gap:9px;padding:10px 11px;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1);
  transition:border-color .15s,box-shadow .15s,transform .15s}
.plat:hover{border-color:var(--line-2);box-shadow:var(--shadow-2);transform:translateY(-1px)}
.plat:active{transform:none}
.plat .pill{width:28px;height:28px;border-radius:8px;flex:0 0 auto;display:grid;place-items:center;
  background:color-mix(in oklab,var(--brand) 11%,transparent);border:1px solid color-mix(in oklab,var(--brand) 20%,var(--line))}
.plat .pill img{width:16px;height:16px;display:block}
.plat .pill .mono{font-size:12px;font-weight:700;color:var(--brand)}
.plat .nm{min-width:0;flex:1 1 auto}
.plat .nm b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plat .nm small{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}
.plat .go{color:var(--muted);flex:0 0 auto;font-size:12px}
.plat .doc{flex:0 0 auto;font-size:10.5px;color:var(--muted);border:1px solid var(--line);
  border-radius:6px;padding:1px 5px;line-height:1.5;background:var(--key-bg);cursor:pointer}
.plat .doc:hover{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.crumpad{display:none}
.crumb .gsel{flex:0 0 auto;margin-left:auto;display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:400;color:var(--ink-2);background:var(--card);border:1px solid var(--line);
  border-radius:99px;padding:1px 7px;cursor:pointer}
.crumb .gsel:hover{background:var(--card);border-color:var(--line-2)}
.crumb .gsel .caret{width:11px;height:11px;color:var(--muted)}
.crumb .gsel.act{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.menu .opt .cnt{margin-left:auto;padding-left:8px;font-size:11px;color:var(--muted);font-weight:400}
.totop{position:fixed;right:14px;bottom:42px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);color:var(--ink-2);border:1px solid var(--line);box-shadow:var(--shadow-2);cursor:pointer;
  opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .16s,transform .16s,visibility .16s;z-index:30}
.totop svg{width:16px;height:16px}
.totop:hover{color:var(--accent);border-color:var(--accent-soft)}
.totop.show{opacity:1;visibility:visible;transform:none}
.plat.solo{grid-column:1/-1}

/* 条目列表：一行 = 标题 + 平台 / 右侧键位 + 复制 */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-1)}
.row{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px 9px 11px;
  border-top:1px solid var(--line);cursor:pointer;text-align:left;transition:background .1s}
.list>.row:first-child{border-top:0}
.row:hover{background:color-mix(in oklab,var(--accent) 4%,var(--card))}
.row.active{background:var(--accent-soft)}
.row .rmain{flex:1 1 auto;min-width:0}
.row b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub .plat-tag{color:var(--brand)}
.row .rtail{flex:0 0 auto;display:flex;align-items:center;gap:6px}
.row .rtail .keys{flex:0 0 auto;display:flex;justify-content:flex-end;max-width:100%}
.row .cp{flex:0 0 auto;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
  color:var(--line-2);background:transparent;border:1px solid transparent;transition:color .12s,background .12s,border-color .12s}
.row:hover .cp{color:var(--muted);border-color:var(--line)}
.row .cp:hover{color:var(--accent);border-color:color-mix(in oklab,var(--accent) 40%,var(--line));background:var(--accent-soft)}
.row .cp svg{width:13px;height:13px}
.row .badge{flex:0 0 auto;font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--surface)}

/* 键帽 */
.kc{display:inline-flex;align-items:center;gap:2px;flex-wrap:nowrap}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:20px;padding:0 5px;border-radius:5px;
  background:var(--key-bg);border:1px solid var(--key-line);border-bottom-width:2px;
  font:500 10px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--key-ink);white-space:nowrap}
.kbd.lg{height:26px;min-width:24px;font-size:12px;padding:0 8px;border-radius:6px}
.kbd-plus{color:var(--muted);font-size:9px;padding:0 1px}
.kbd-arrow{color:var(--muted);font-size:9.5px;padding:0 3px}
.kbd-none{font-size:10.5px;color:var(--muted)}

.group{margin-bottom:12px}
.group:first-child{margin-top:0}
.group-head{display:flex;align-items:center;gap:7px;margin:0 0 6px 2px}
.group-head b{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.group-head span{font-size:10.5px;color:var(--muted)}
.group-head .ic{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;background:color-mix(in oklab,var(--brand) 12%,transparent)}
.group-head .ic img{width:11px;height:11px}

.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12px}
.empty p{margin:0 0 3px;color:var(--ink-2)}
.empty small{font-size:11px}

.more{width:100%;margin-top:10px;height:34px;border-radius:10px;border:1px dashed var(--line-2);color:var(--ink-2);font-size:12px}
.more:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.foot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 16px 9px;font-size:10.5px;color:var(--muted);border-top:1px solid var(--line)}
.dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-right:4px;vertical-align:1px}
.dot.off{background:var(--muted)}

/* 抽屉 */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,90%);z-index:50;background:var(--surface);
  border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s cubic-bezier(.22,.61,.36,1);
  display:flex;flex-direction:column;box-shadow:-24px 0 48px -32px rgba(0,0,0,.4)}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px 10px;border-bottom:1px solid var(--line)}
.drawer-head h3{margin:0;font-size:13px;font-weight:650}
.drawer-body{flex:1 1 auto;overflow:auto;padding:12px 15px 20px}
.dsec{margin-bottom:16px}
.dsec h4{margin:0 0 7px;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.08em}
.path{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;
  font:500 10.5px/1.5 ui-monospace,Consolas,monospace;color:var(--ink-2);word-break:break-all}
.pack{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin-bottom:6px}
.pack .ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:color-mix(in oklab,var(--brand) 12%,transparent);flex:0 0 auto}
.pack .ic img{width:13px;height:13px}
.pack .mt{min-width:0;flex:1 1 auto}
.pack .mt b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pack .mt small{display:block;font-size:10px;color:var(--muted);font-family:ui-monospace,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);opacity:0;transition:opacity .14s}
.pack:hover .mini{opacity:1}
.mini:hover{color:#C0392B;background:var(--paper)}
.mini svg{width:13px;height:13px}
.drop{border:1px dashed var(--line-2);border-radius:10px;padding:12px;text-align:center;background:var(--card)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop p{margin:0 0 2px;font-size:12px;color:var(--ink-2)}
.drop small{font-size:10.5px;color:var(--muted)}
.btn{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  font-size:11.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--line-2);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{opacity:.9}
.btn-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.btn svg{width:13px;height:13px}

/* 内容筛选条（快捷键 / 代码模板） */
.kbar{display:flex;gap:4px;padding:0 16px 8px}
.kbar[hidden]{display:none}
.kbar button{flex:1 1 0;min-width:0;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--card);
  font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:5px}
.kbar button:hover{color:var(--ink-2)}
.kbar button .n{font-size:10px;color:var(--muted)}
.kbar button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.kbar button.on .n{color:var(--accent)}

/* 弹窗 */
.mscrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:60;display:grid;place-items:center;padding:12px;overflow:hidden}
.modal{width:min(460px,calc(100vw - 24px));background:var(--card);border-radius:14px;border:1px solid var(--line);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.5);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden;animation:pop .16s ease-out}
@keyframes pop{from{transform:scale(.97);opacity:.7}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 16px 8px}
.mhead h3{margin:0;font-size:14px;font-weight:650}
.mhead p{margin:2px 0 0;font-size:11px;color:var(--muted)}
.mbody{padding:0 16px 6px;overflow-y:auto;overflow-x:hidden;flex:1 1 auto;min-height:0;overscroll-behavior:contain}
.mfoot{display:flex;align-items:center;justify-content:flex-end;gap:7px;padding:11px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.hero{display:flex;justify-content:center;gap:3px;flex-wrap:wrap;padding:16px 10px;margin:4px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.kv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px}
.kv dt{color:var(--muted);font-size:11px}
.kv dd{margin:0;color:var(--ink-2);word-break:break-word}
.dnote{margin:10px 0 0;font-size:12px;color:var(--ink-2);line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.dnote.dim{color:var(--muted)}
/* 代码块：一个固定边距的圆角框，标题条 + 代码区，代码自己横竖滚动 */
.dcodewrap{margin:10px 0 0;border:1px solid color-mix(in oklab,var(--ink) 12%,transparent);border-radius:9px;
  background:color-mix(in oklab,var(--ink) 7%,transparent);overflow:hidden;display:flex;flex-direction:column;
  max-height:min(40vh,240px);min-height:0}
.dcodehead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 10px;
  border-bottom:1px solid color-mix(in oklab,var(--ink) 10%,transparent);font-size:10.5px;color:var(--muted);
  flex:0 0 auto;letter-spacing:.02em}
.dcode{margin:0;padding:9px 11px;border:0;border-radius:0;background:transparent;flex:1 1 auto;min-height:0;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11.5px;line-height:1.55;color:var(--ink-2);
  white-space:pre;overflow:auto;overscroll-behavior:contain;tab-size:2;max-height:none;max-width:none}
.dcode::-webkit-scrollbar{width:10px;height:10px}
.dcode::-webkit-scrollbar-track{background:transparent}
.dcode::-webkit-scrollbar-thumb{background:color-mix(in oklab,var(--ink) 22%,transparent);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.dcode::-webkit-scrollbar-thumb:hover{background:color-mix(in oklab,var(--ink) 36%,transparent);background-clip:padding-box}
.dcode::selection{background:color-mix(in oklab,var(--brand) 26%,transparent)}
.lnk{padding:0;font-size:12px;color:var(--muted);background:none;border:0;cursor:pointer}
.lnk:hover{color:var(--accent);text-decoration:underline}
.dsrc{margin:12px 0 0}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);outline:0;font-size:12.5px}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pvlist{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.pvrow{display:flex;align-items:center;gap:8px;padding:6px 9px;border-top:1px solid var(--line);font-size:11.5px}
.pvrow:first-child{border-top:0}
.pvrow span{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,12px);z-index:80;background:var(--ink);color:var(--paper);
  font-size:12px;padding:7px 13px;border-radius:99px;opacity:0;pointer-events:none;transition:.18s;
  box-shadow:0 10px 26px -14px rgba(0,0,0,.7);max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}

/* 窄窗（默认小窗） */
@media(max-width:419px){
  .fld.narrow{flex:0 0 124px;padding:0 24px 0 10px}
  .grid{grid-template-columns:1fr}
}
@media(min-width:600px){.grid{grid-template-columns:repeat(var(--cols,3),minmax(0,1fr))}}

  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function norm(s) { return String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim(); }
function b64(s) {
  var bytes = new TextEncoder().encode(String(s));
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function hostSend(cmd, a1, a2) {
  if (!HOST) return;

// 由它把按下事件转给外壳，进入系统原生缩放。只留一个角，避免四条边的误触。
(function () {
  var el = document.createElement('div');
  el.className = 'edge';
  el.style.cssText = 'position:fixed;right:0;bottom:0;width:14px;height:14px;z-index:95;cursor:nwse-resize';

    if (ev.button !== 0) return;
    ev.preventDefault();

    hostSend('dragedge', '17');
  });
  document.body.appendChild(el);
})();

  var el = ev.target && ev.target.closest ? ev.target.closest('.dcode') : null;

  if (el.scrollWidth <= el.clientWidth) return;
  ev.preventDefault();
  el.scrollLeft += (ev.deltaY || 0) + (ev.deltaX || 0);
}, { passive: false });

  var s = (typeof KP_PYFULL === 'string') ? KP_PYFULL : '';

  var out = '';

  return out;
}

// ---------- 键位解析（导入用） ----------
var KEY_ALIAS = {
  control: 'Ctrl', ctrl: 'Ctrl', meta: 'Win', win: 'Win', windows: 'Win', alt: 'Alt', shift: 'Shift',
  enter: 'Enter', return: 'Enter', escape: 'Esc', esc: 'Esc', tab: 'Tab', space: 'Space',
  backspace: 'Backspace', back_space: 'Backspace', delete: 'Delete', insert: 'Insert',
  home: 'Home', end: 'End', page_up: 'PageUp', page_down: 'PageDown', up: '↑', down: '↓', left: '←', right: '→',
  slash: '/', back_slash: '\\', period: '.', comma: ',', semicolon: ';', colon: ':', quote: "'", back_quote: '`',
  open_bracket: '[', close_bracket: ']', open_brace: '{', close_brace: '}', minus: '-', plus: '+', equals: '=',
  less: '<', greater: '>', exclamation: '!', number_sign: '#', dollar: '$', percent: '%', ampersand: '&',
  asterisk: '*', paren_left: '(', paren_right: ')', underscore: '_', bar: '|', at: '@', circumflex: '^', tilde: '~'
};
function mapKey(tok) {
  var t = String(tok).trim();
  if (!t) return '';
  var low = t.toLowerCase().replace(/\s+/g, '_');
  if (KEY_ALIAS[low]) return KEY_ALIAS[low];
  if (/^f\d{1,2}$/.test(low)) return low.toUpperCase();
  if (low.length === 1) return low.toUpperCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function chordFromTokens(tokens) {
  var mods = [], key = '';
  for (var i = 0; i < tokens.length; i++) {
    var k = mapKey(tokens[i]);
    if (k === 'Ctrl' || k === 'Alt' || k === 'Shift' || k === 'Win') mods.push(k);
    else if (k) key = k;
  }
  mods.sort(function (a, b) {
    var order = { Ctrl: 0, Alt: 1, Shift: 2, Win: 3 };
    return (order[a] === undefined ? 9 : order[a]) - (order[b] === undefined ? 9 : order[b]);
  });
  return mods.concat(key ? [key] : []).join('+');
}
function humanizeAction(idOrCmd) {
  var s = String(idOrCmd || '').replace(/^[-_.]+/, '');
  s = s.replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/[._-]+/g, ' ').trim();
  if (!s) s = String(idOrCmd || '未命名');
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function parseIdeaXml(text) {
  var doc = new DOMParser().parseFromString(text, 'text/xml');
  var actions = doc.getElementsByTagName('action');
  var out = [];
  for (var i = 0; i < actions.length; i++) {
    var a = actions[i];
    var id = a.getAttribute('id') || '';
    var ks = a.getElementsByTagName('keyboard-shortcut');
    for (var j = 0; j < ks.length; j++) {
      var first = ks[j].getAttribute('first-keystroke') || '';
      var second = ks[j].getAttribute('second-keystroke') || '';
      if (!first) continue;
      var keys = [chordFromTokens(first.split(/\s+/))];
      if (second) keys.push(chordFromTokens(second.split(/\s+/)));
      var act = a.getAttribute('text') || humanizeAction(id);
      out.push({ action: act, keys: keys, group: '导入', note: id ? 'IDEA action: ' + id : '' });
    }
  }
  return out;
}
function parseVsCode(text) {
  var arr = JSON.parse(text);
  if (!Array.isArray(arr)) arr = [arr];
  var out = [];
  for (var i = 0; i < arr.length; i++) {
    var it = arr[i];
    if (!it || !it.key) continue;
    var segs = String(it.key).split(/\s+/).map(function (seg) {
      return chordFromTokens(seg.split('+'));
    });
    out.push({
      action: it.command ? humanizeAction(it.command) : '未命名',
      keys: segs,
      group: '导入',
      note: it.command ? 'VS Code command: ' + it.command : ''
    });
  }

}
function parseCsv(text) {
  var lines = text.replace(/\r/g, '').split('\n').filter(function (l) { return l.trim(); });
  var out = [];
  for (var i = 0; i < lines.length; i++) {
    var cells = lines[i].split(',').map(function (c) { return c.trim().replace(/^"|"$/g, ''); });
    if (i === 0 && /动作|action/i.test(cells[0])) continue;
    if (!cells[0]) continue;
    out.push({
      action: cells[0],
      keys: (cells[1] || '').split('|').map(function (s) { return s.trim(); }).filter(function (s) { return s; }),
      group: cells[2] || '其他',
      aliases: (cells[3] || '').split('|').map(function (s) { return s.trim(); }).filter(function (s) { return s; }),
      note: cells[4] || ''
    });
  }
  return out;
}
function parseAnyFile(name, text) {
  var low = name.toLowerCase();
  if (low.endsWith('.xml')) return { kind: 'IDEA keymap', items: parseIdeaXml(text) };
  if (low.endsWith('.csv')) return { kind: 'CSV', items: parseCsv(text) };
  var obj = JSON.parse(text);
  if (obj && (obj.schema || Array.isArray(obj.shortcuts))) {
    return {
      kind: '配置包', pack: obj,
      items: (obj.shortcuts || []).map(function (s) { return { action: s.action, keys: s.keys || [], group: s.group || '其他', aliases: s.aliases || [], note: s.note || '' }; })
    };
  }
  return { kind: 'VS Code keybindings', items: parseVsCode(text) };
}

// ---------- 数据加载 ----------
function loadPacks(files) {
  S.files = files || [];
  var list = S.files.filter(function (f) {
    return !/^_/.test(f) && !/\.bak\.json$/i.test(f);
  });
  var jobs = list.map(function (f) {
    return fetch(PACK_BASE + encodeURIComponent(f), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { j._file = f; return j; })
      .catch(function () { return null; });
  });
  Promise.all(jobs).then(function (arr) {
    S.packs = arr.filter(function (p) { return p && p.platform; });
    try {
      prepare();
    } catch (err) {
      // 不能再卡在“读取配置中”：出错就把原因显示出来，方便直接定位是哪个包的问题
      S.ready = true;
      var mainEl = $('#main');
      if (mainEl) {
        mainEl.innerHTML = '<div class="empty"><p>读取配置出错</p><small>' +
          esc(err && err.message ? err.message : String(err)) + '</small><small>多半是 packs 里某个 json 的字段类型不对</small></div>';
      }
    }
  });
}
function prepare() {

  S.plats.sort(function (a, b) {
    var ia = ORDER.indexOf(a.platform); if (ia < 0) ia = 99;
    var ib = ORDER.indexOf(b.platform); if (ib < 0) ib = 99;
    if (ia !== ib) return ia - ib;
    return a.name < b.name ? -1 : 1;
  });
  buildIndex();
  buildPlatMenu();
  if (S.platSel && !S.plats.some(function (p) { return p.platform === S.platSel; })) S.platSel = '';
  syncPlat();
  S.ready = true;
  render();
  $('#statusText').textContent = '↑↓ 选择 · Enter 复制 · Ctrl+1 全部平台';
}

// ---------- 平台下拉（自绘） ----------
function platName(id) {
  if (!id) return '全部平台';
  for (var i = 0; i < S.plats.length; i++) if (S.plats[i].platform === id) return S.plats[i].name;
  return '全部平台';
}
function syncPlat() {
  $('#qPlatLabel').textContent = platName(S.platSel);
  var opts = $('#qPlatMenu').querySelectorAll('.opt');
  for (var i = 0; i < opts.length; i++) {
    var v = opts[i].getAttribute('data-platv') || '';
    opts[i].classList.toggle('on', v === S.platSel);
  }
}
function setPlat(id, rerender) {
  var changed = (S.platSel || '') !== (id || '');
  S.platSel = id || '';
  if (changed) S.groupSel = '';
  syncPlat();
  if (rerender !== false) render();
}
function buildPlatMenu() {
  var html = '<div class="opt" data-platv=""><span class="nm">全部平台</span>' +
    '<svg class="tick" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>' +
    '<div class="sepline"></div>';
  for (var i = 0; i < S.plats.length; i++) {
    var p = S.plats[i];
    html += '<div class="opt" data-platv="' + esc(p.platform) + '">' +
      '<span class="dotm" style="--brand:' + esc(p.color) + '"></span>' +
      '<span class="nm">' + esc(p.name) + '</span>' +
      '<svg class="tick" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>';
  }
  $('#qPlatMenu').innerHTML = html;
}
function openPlatMenu() {
  var fld = $('#fldPlat'), menu = $('#qPlatMenu');
  var r = fld.getBoundingClientRect();
  menu.style.left = Math.round(r.left) + 'px';
  menu.style.top = Math.round(r.bottom + 6) + 'px';
  menu.style.width = Math.round(r.width) + 'px';
  menu.classList.remove('hidden');
  fld.classList.add('open');
  $('#qPlatBtn').setAttribute('aria-expanded', 'true');
  syncPlat();
  var on = menu.querySelector('.opt.on');
  if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
}
function closePlatMenu() {
  $('#qPlatMenu').classList.add('hidden');
  $('#fldPlat').classList.remove('open');
  $('#qPlatBtn').setAttribute('aria-expanded', 'false');
}
function platMenuOpen() { return !$('#qPlatMenu').classList.contains('hidden'); }
function applyStats(text) {
  if (!text) return;
  try {
    var j = JSON.parse(text);
    if (j && typeof j === 'object') {
      S.usage = j;
      try { localStorage.setItem(USAGE_KEY, JSON.stringify(j)); } catch (e) { }
    }
  } catch (e) { }
}

// ---------- 宿主消息 ----------
function onHostMessage(ev) {
  var raw = ev && ev.data;
  if (typeof raw !== 'string') return;
  var parts = raw.split('|');
  var cmd = parts[0] || '';
  var a1 = parts[1] ? unb64(parts[1]) : '';
  var a2 = parts[2] ? unb64(parts[2]) : '';
  switch (cmd) {
    case 'init':
      var j = {};
      try { j = JSON.parse(a1); } catch (e) { }
      S.root = j.root || '';
      loadPacks(j.files || FALLBACK_FILES);
      break;
    case 'stats':
      applyStats(a1);
      render();
      break;
    case 'saved':
      toast(a1 || '已保存');
      break;
    case 'deleted':
      toast('已删除 ' + a1 + '（可在 packs\\_已删除 找回）');
      hostSend('reload');
      break;
    case 'error':
      toast(a1 || '出错了');
      break;
    case 'focus':
      try { $('#qAct').focus(); $('#qAct').select(); } catch (e) { }
      break;
    case 'backdrop':
      break;
    case 'themeQuery':
      hostSend('theme', S.theme, (themeById(S.theme) && themeById(S.theme).transparent) ? '1' : '0');
      break;
    case 'themeFallback':
      applyTheme(a1 || 'light', true);
      toast('当前系统不支持亚克力背景，已切回浅色');
      break;
    case 'pin':
      $('#pinBtn').classList.toggle('on', a1 === '1');
      break;
  }
}
function unb64(s) {
  try {
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  } catch (e) { return ''; }
}

// ---------- 事件 ----------
function bindEvents() {
  var qAct = $('#qAct');
  function onInput() { render(); }
  qAct.addEventListener('input', onInput);
  qAct.addEventListener('focus', function () { S.active = -1; });

  // 平台下拉：按钮开合 + 选项点击 + 点别处收起
  $('#qPlatBtn').addEventListener('click', function (ev) {
    ev.stopPropagation();
    if (platMenuOpen()) closePlatMenu(); else openPlatMenu();
  });
  $('#qPlatMenu').addEventListener('click', function (ev) {
    var opt = ev.target.closest('.opt');
    if (!opt) return;
    setPlat(opt.getAttribute('data-platv'));
    closePlatMenu();
    qAct.focus();
  });
  document.addEventListener('click', function (ev) {
    if (grpMenuOpen() && !ev.target.closest('#grpMenu') && !ev.target.closest('#grpBtn')) closeGrpMenu();
    if (!platMenuOpen()) return;
    if (ev.target.closest('#qPlatMenu') || ev.target.closest('#qPlatBtn')) return;
    closePlatMenu();
  });
  window.addEventListener('resize', function () {
    if (platMenuOpen()) closePlatMenu();
    if (grpMenuOpen()) closeGrpMenu();
  });
  $('#main').addEventListener('scroll', function () {
    if (platMenuOpen()) closePlatMenu();
    if (grpMenuOpen()) closeGrpMenu();
  });

  $('#clrAct').addEventListener('click', function () { qAct.value = ''; render(); qAct.focus(); });
  $('#themeBtn').addEventListener('click', cycleTheme);
  $('#pinBtn').addEventListener('click', function () {
    var on = !$('#pinBtn').classList.contains('on');
    $('#pinBtn').classList.toggle('on', on);
    hostSend('pin', on ? '1' : '0');
    toast(on ? '已置顶' : '已解锁，可被其它窗口盖住');
  });
  if (IN_HOST) document.body.classList.add('in-host');
  $('.bar').addEventListener('mousedown', function (ev) {
    if (ev.button !== 0 || ev.target.closest('button') || !IN_HOST) return;
    hostSend('drag');
  });
  $('#cfgBtn').addEventListener('click', openDrawer);
  $('#hideBtn').addEventListener('click', function () { hostSend('hide'); });
  $('#drawerClose').addEventListener('click', closeDrawer);
  $('#scrim').addEventListener('click', closeDrawer);

  $('#main').addEventListener('click', function (ev) {
    var tgl = ev.target.closest('[data-hot-toggle]');
    if (tgl) {
      S.hotCollapsed = !S.hotCollapsed;
      try { localStorage.setItem('kp.hotCollapsed', S.hotCollapsed ? '1' : '0'); } catch (e) { }
      render();
      return;
    }
    var back = ev.target.closest('[data-back]');
    if (back) { setPlat(''); qAct.focus(); return; }
    var doc = ev.target.closest('[data-doc]');
    if (doc) {
      ev.stopPropagation();
      hostSend('openUrl', doc.getAttribute('data-doc') || '');
      return;
    }
    var chip = ev.target.closest('[data-group]');
    if (chip) {
      S.groupSel = chip.getAttribute('data-group') || '';
      render();
      return;
    }
    var platBtn = ev.target.closest('[data-plat]');
    if (platBtn) {
      var pid = platBtn.getAttribute('data-plat');
      var p = null;
      for (var i = 0; i < S.plats.length; i++) if (S.plats[i].platform === pid) p = S.plats[i];
      if (p) { qAct.value = ''; setPlat(p.platform); qAct.focus(); }
      return;
    }
    var row = ev.target.closest('.row');
    if (row) {
      if (ev.target.closest('[data-copy]')) copyEntry(row.getAttribute('data-id'));
      else openDetail(row.getAttribute('data-id'));
    }
  });

  $('#main').addEventListener('scroll', updateToTop);
  $('#toTop').addEventListener('click', function () {
    var m = $('#main');
    if (m.scrollTo) m.scrollTo({ top: 0, behavior: 'smooth' });
    else m.scrollTop = 0;
  });

  $('#crumb').addEventListener('click', function (ev) {
    if (ev.target.closest('[data-back]')) { setPlat(''); qAct.focus(); return; }
    if (ev.target.closest('#grpBtn')) {
      ev.stopPropagation();
      if (grpMenuOpen()) closeGrpMenu(); else openGrpMenu();
    }
  });
  $('#kbar').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-kindv]');
    if (!btn) return;
    S.kindSel = btn.getAttribute('data-kindv') || '';
    S.groupSel = '';
    render();
  });

  $('#grpMenu').addEventListener('click', function (ev) {
    var opt = ev.target.closest('.opt');
    if (!opt) return;
    S.groupSel = opt.getAttribute('data-grpv') || '';
    closeGrpMenu();
    render();
  });

  $('#openFolderBtn').addEventListener('click', function () {
    if (IN_HOST) hostSend('openFolder'); else toast('独立预览模式无法打开文件夹');
  });
  $('#reloadBtn').addEventListener('click', function () {
    if (IN_HOST) hostSend('reload'); else { toast('独立预览模式：刷新页面即可'); }
  });
  $('#newPackBtn').addEventListener('click', openNewPack);
  $('#packList').addEventListener('click', function (ev) {
    var del = ev.target.closest('[data-del]');
    if (!del) return;
    var file = del.getAttribute('data-del');
    askConfirm('删除平台配置', '会把 ' + file + ' 移到 packs\\_已删除，之后可以找回。', function () {
      if (IN_HOST) hostSend('deletePack', file); else toast('独立预览模式不能删除文件');
    });
  });
  $('#clearStatsBtn').addEventListener('click', function () {
    askConfirm('清空使用记录', '所有「常用」次数会归零，键位配置不受影响。', function () {
      S.usage = {};
      persistUsage();
      render();
      toast('使用记录已清空');
    });
  });

  // 文件导入
  var fileInput = $('#fileInput');
  $('#pickFileBtn').addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function () {
    if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
    fileInput.value = '';
  });
  var dz = $('#dropZone');
  ['dragenter', 'dragover'].forEach(function (t) {
    dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (t) {
    dz.addEventListener(t, function (e) { e.preventDefault(); dz.classList.remove('over'); });
  });
  dz.addEventListener('drop', function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) handleFile(f);
  });

  document.addEventListener('keydown', onKeydown);
  window.addEventListener('resize', function () { if (S.ready) render(); });
}
function handleFile(file) {
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var parsed = parseAnyFile(file.name, String(rd.result));
      importPreview(file.name, parsed);
    } catch (e) {
      toast('解析失败：' + e.message);
    }
  };
  rd.readAsText(file, 'utf-8');
}
function onKeydown(ev) {
  var key = ev.key;
  if (key === 'Escape') {
    if ($('#modalRoot').innerHTML) { closeModal(); ev.preventDefault(); return; }
    if (grpMenuOpen()) { closeGrpMenu(); ev.preventDefault(); return; }
    if (platMenuOpen()) { closePlatMenu(); ev.preventDefault(); return; }
    if ($('#drawer').classList.contains('show')) { closeDrawer(); ev.preventDefault(); return; }
    if ($('#qAct').value) { $('#qAct').value = ''; render(); ev.preventDefault(); return; }
    if (S.platSel) { setPlat(''); ev.preventDefault(); return; }
    if (IN_HOST) hostSend('hide');
    return;
  }
  if ((ev.ctrlKey || ev.metaKey) && (key === 'f' || key === 'k')) {
    $('#qAct').focus(); $('#qAct').select(); ev.preventDefault(); return;
  }
  if (key === 'ArrowDown') { setActive(1); ev.preventDefault(); return; }
  if (key === 'ArrowUp') { setActive(-1); ev.preventDefault(); return; }
  // Ctrl+1 回到全部平台，Ctrl+2…9 依次直选平台
  if ((ev.ctrlKey || ev.metaKey) && /^[0-9]$/.test(key) && !$('#modalRoot').innerHTML) {
    var n = parseInt(key, 10);
    if (n === 1) { setPlat(''); ev.preventDefault(); return; }
    if (n >= 2 && n - 1 <= S.plats.length) { setPlat(S.plats[n - 2].platform); ev.preventDefault(); return; }
  }
  if (key === 'Enter' && S.active >= 0) {
    var rows = document.querySelectorAll('#main .row');
    if (rows[S.active]) copyRow(rows[S.active].getAttribute('data-id'));
    ev.preventDefault();
  }
}

// ---------- 启动 ----------
function boot() {
  loadUsage();
  try { S.hotCollapsed = localStorage.getItem('kp.hotCollapsed') === '1'; } catch (e) { }
  bindEvents();
  $('#hideBtn').style.display = IN_HOST ? '' : 'none';

  // 先用内置主题立即上色：不等 theme.json，避免开窗白闪
  var saved = '';
  try { saved = localStorage.getItem('kp.theme') || ''; } catch (e) { }
  applyTheme(themeById(saved) ? saved : (DEFAULT_THEMES.default || 'light'), false);

  // 数据链路立刻开跑，与主题文件并行
  if (IN_HOST) {
    if (window.chrome.webview.addEventListener) window.chrome.webview.addEventListener('message', onHostMessage);
    $('#bridgeState').innerHTML = '<span class="dot"></span>已连接 KeyPeek 外壳';
    hostSend('hello');
    hostSend('loadStats');
    setTimeout(function () { if (!S.ready) loadPacks(FALLBACK_FILES); }, 900);
  } else {
    $('#bridgeState').innerHTML = '<span class="dot off"></span>独立预览';
    loadPacks(FALLBACK_FILES);
  }

  // 主题文件后台加载，回来后再对齐一次（同 id 时无变化）
  loadThemes(null);
  setTimeout(function () { $('#qAct').focus(); }, 60);
}
boot();
})();
</script>
